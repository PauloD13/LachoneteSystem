services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Volume NOMEADO: dados do banco persistem mesmo se o container for
      # recriado (requisito explícito do enunciado).
      - db_data:/var/lib/postgresql/data
      # Monta nossos scripts (001_schema.sql, 002_seed.sql) dentro da pasta
      # especial que a imagem oficial do Postgres executa automaticamente, em
      # ordem alfabética, SÓ na primeira inicialização (quando o volume
      # db_data está vazio). Para reaplicá-los depois de uma mudança no
      # schema: `docker compose down -v` (apaga os dados!) e subir de novo.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # Se o processo cair (ou o servidor da sala reiniciar), o Docker sobe de novo.
    restart: unless-stopped
    environment:
      # Conexão com o banco em partes separadas: é o backend (config/env.ts)
      # que monta a URL, escapando a senha. Assim a senha pode conter @ : / #
      # sem quebrar a conexão — o que acontecia quando a URL era montada aqui
      # por interpolação. "db" é o nome do serviço acima (rede interna do
      # Compose), nunca localhost/IP fixo.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: ${BACKEND_PORT}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Autenticação (obrigatórias — ver .env.example).
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_SENHA: ${ADMIN_SENHA}
      # Opcionais: se não estiverem no .env, valem os padrões do backend.
      JWT_EXPIRA_EM_HORAS: ${JWT_EXPIRA_EM_HORAS:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-}
      LIMITE_REQUISICOES_POR_MINUTO: ${LIMITE_REQUISICOES_POR_MINUTO:-}
      LIMITE_TENTATIVAS_LOGIN: ${LIMITE_TENTATIVAS_LOGIN:-}
    ports:
      - "${HOST_BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    # "Está saudável" = a API responde E consegue consultar o banco (GET
    # /health devolve 503 se o banco estiver fora). Usa o próprio Node para
    # fazer a requisição: a imagem não tem curl. O estado aparece em
    # `docker compose ps`.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db_data:
